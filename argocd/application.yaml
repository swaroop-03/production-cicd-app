apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-cicd-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/swaroop-03/production-cicd-app.git
    targetRevision: main
    path: helm

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
